<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Memory Map's icon: a memory chip holding a treemap, in the map's dark-theme group colours
       (App.axaml). Adapted from Material Symbols Light "memory-sharp" (the chip and its pins) and
       "bento-sharp" (the three-tile layout), Copyright Google LLC, Apache License 2.0
       (https://github.com/google/material-design-icons/blob/master/LICENSE). Changed: the two
       combined, the bento's dot left out, the tiles recoloured and set on a dark tile. -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#1a1a19"/>
  <!-- Drawn on the symbols' 24-unit grid, centred and scaled to the tile. -->
  <g transform="translate(32 32) scale(3.4) translate(-12 -12)">
    <g fill="#c3c2b7">
      <rect x="6" y="6" width="12" height="12"/>
      <rect x="9.5" y="4.462" width="1" height="1.538"/>
      <rect x="13.5" y="4.462" width="1" height="1.538"/>
      <rect x="9.5" y="18" width="1" height="1.539"/>
      <rect x="13.5" y="18" width="1" height="1.539"/>
      <rect x="4.462" y="9.5" width="1.538" height="1"/>
      <rect x="4.462" y="13.5" width="1.538" height="1"/>
      <rect x="18" y="9.5" width="1.539" height="1"/>
      <rect x="18" y="13.5" width="1.539" height="1"/>
    </g>
    <rect x="7" y="7" width="10" height="10" fill="#1a1a19"/>
    <rect x="7.75" y="7.75" width="4.65" height="8.5" rx="0.4" fill="#3987e5"/>
    <rect x="13.15" y="7.75" width="3.1" height="3.85" rx="0.4" fill="#d95926"/>
    <rect x="13.15" y="12.35" width="3.1" height="3.9" rx="0.4" fill="#199e70"/>
  </g>
</svg>
