# The merge gate (scripts/check.ps1): format check, warnings-as-errors build, every test that runs on
# the OS. All build the whole solution; Ubuntu (amd64 and arm64) runs all but the Windows tests (D030),
# with the live /proc and process-action tests. The package job builds each architecture's .deb on its
# own runner and checks it in containers (D036, D041).
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pwsh scripts/check.ps1
      - name: Cross-check against free and ps
        if: runner.os == 'Linux'
        run: python3 scripts/crosscheck-linux.py
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash scripts/publish-linux.sh
      - run: bash scripts/deb-check.sh publish/memory-map_*.deb
