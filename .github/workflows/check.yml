# The merge gate (scripts/check.ps1): format check, warnings-as-errors build, every test that runs on
# the OS. Windows runs the whole solution; Ubuntu runs MemoryMap.Linux.slnf, including the live /proc test.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pwsh scripts/check.ps1
      - name: Cross-check against free and ps
        if: runner.os == 'Linux'
        run: python3 scripts/crosscheck-linux.py
